[project]
name = "gastrobeleg"
version = "0.1.0"
description = "Invoice and delivery-note ingestion for independent German restaurants"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "lxml>=5.3",
    # ZUGFeRD is a PDF/A-3 carrying the CII XML as an attachment. pikepdf reads
    # the embedded-file tree directly; factur-x wraps the same job but drags in
    # a PDF generator we have no use for on the read path.
    "pikepdf>=9.4",
    "anthropic>=0.70",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = "pikepdf.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
# .design holds one-off scripts written for Figma audits, not application code.
extend-exclude = [".design", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
]
